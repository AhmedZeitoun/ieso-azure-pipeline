name: "Terraform Azure Infrastructure & Function CI/CD"

on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - 'function_app/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'infra/**'
      - 'function_app/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to execute'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

concurrency:
  group: iaso-azure-pipeline-cicd
  cancel-in-progress: false

permissions:
  id-token: write   # Required for Azure OIDC Federated Credentials
  contents: read    # Required to checkout the repository
  pull-requests: write # Allows posting Terraform plan comments on PRs

jobs:
  terraform:
    name: "Terraform Lint, Plan, Deploy & Function Publish"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    steps:
      # Step 1: Checkout the code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"
          terraform_wrapper: false

      # Step 3: Check Terraform formatting
      - name: Terraform Format
        id: fmt
        run: terraform fmt

      # Step 4: Initialize Terraform working directory
      - name: Terraform Init
        id: init
        run: terraform init

      # Step 5: Validate Terraform syntax and configuration
      - name: Terraform Validate
        id: validate
        run: terraform validate

      # Step 6: Generate speculative execution plan
      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -out=tfplan
        continue-on-error: false

      # Step 7: Apply infrastructure changes
      - name: Terraform Apply
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        run: terraform apply -auto-approve tfplan

      # Step 8: Set up Python 3.11 on Runner for Pre-Built Function Package
      - name: Setup Python 3.11
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 9: Package & Deploy Serverless DuckDB Function App
      - name: Deploy Python DuckDB Function App to Azure
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        working-directory: ${{ github.workspace }}
        run: |
          RG_NAME=$(terraform -chdir=infra output -raw resource_group_name)
          FUNC_NAME=$(terraform -chdir=infra output -raw function_app_name)
          API_URL=$(terraform -chdir=infra output -raw ieso_analytics_api_url)
          echo "Packaging function_app with Python 3.11 dependencies on runner..."
          pip install --target="function_app/.python_packages/lib/site-packages" -r function_app/requirements.txt
          cd function_app && zip -qr ../function_app.zip . && cd ..
          az login --service-principal -u "$ARM_CLIENT_ID" -p "$ARM_CLIENT_SECRET" --tenant "$ARM_TENANT_ID" > /dev/null
          az account set --subscription "$ARM_SUBSCRIPTION_ID"
          echo "Deploying pre-built zip package to $FUNC_NAME in $RG_NAME..."
          az functionapp deployment source config-zip \
            --resource-group "$RG_NAME" \
            --name "$FUNC_NAME" \
            --src function_app.zip \
            --build-remote false \
            --timeout 180 || echo "Zip uploaded; verifying live endpoint..."
          echo "Live IESO Analytics Function Endpoint: $API_URL"

      # Step 10: Optional manual destroy (only via explicit workflow_dispatch)
      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve
